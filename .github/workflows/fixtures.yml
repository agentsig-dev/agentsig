name: Fixture integrity

on:
  push:
  # Deliberately unfiltered: every PR, including every fixture change, is checked.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-integrity:
    name: Fixtures / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # audit-fixtures checks the original fixture commit, not only HEAD.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Audit RFC, fixture, and crypto chain independently of the engine
        run: npm run audit:fixtures
      - name: Check pinned fixture bytes and Git line endings
        run: node --test tests/fixture-integrity.test.mjs
      - name: Audit M2 source snapshots and independent vectors without production code
        run: node --test tests/m2-fixture-audit.test.mjs
      - name: Audit JWKS sources, algorithm snapshots, and approved policy fixtures
        run: node --test tests/jwks-fixture-audit.test.mjs
      - name: Audit profile origin, duplicate, and identity expectations independently
        run: node --test tests/profile-fixture-audit.test.mjs
      - name: Audit independent signer golden bytes and frozen error contract
        run: node --test tests/signing-fixture-audit.test.mjs
      - name: Audit reset epochs, operator catalog, and observer contracts independently
        run: node --test tests/reset-fixture-audit.test.mjs
      - name: Audit metadata classification and pinned protocol attribution independently
        run: node --test tests/metadata-fixture-audit.test.mjs
      - name: Audit pinned M3 discovery sources and upstream JSON vectors independently
        run: node --test tests/m3-fixture-audit.test.mjs
      - name: Audit approved M3 contracts and public TLS test material independently
        run: node --test tests/m3-contract-audit.test.mjs
      - name: Validate the local HTTPS directory test harness
        run: node --test tests/directory-server.test.mjs
      - name: Audit pinned IANA address sources and conservative admission expectations
        run: node --test tests/m3-address-audit.test.mjs
      - name: Audit explicit address exceptions and pinned transport contracts
        run: node --test tests/m3-transport-audit.test.mjs
      - name: Audit bounded freshness arithmetic and restrictive metadata expectations
        run: node --test tests/m3-freshness-audit.test.mjs
      - name: Audit malformed Cache-Control persistence amendment
        run: node --test tests/m3-freshness-amendment-audit.test.mjs
      - name: Audit thumbprint rotation and refresh diagnostic expectations
        run: node --test tests/m3-rotation-audit.test.mjs
      - name: Audit pinned M4 framework and transport sources without executing upstream code
        run: node --test tests/m4-source-audit.test.mjs